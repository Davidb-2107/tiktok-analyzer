name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  R2_ACCOUNT_ID: ci-account
  R2_ACCESS_KEY_ID: ci-access-key
  R2_SECRET_ACCESS_KEY: ci-secret-key
  R2_BUCKET: ci-bucket
  R2_ENDPOINT: https://example.invalid
  ALLOWED_ORIGIN: '*'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check PR or push diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            if [[ -n "$base" ]]; then git diff --check "$base..HEAD"; else git diff --check; fi
          fi
      - name: Run brief compiler smoke tests
        env:
          VAULT_DIR: ${{ github.workspace }}/tests/fixtures/vault
        run: |
          for channel in @ci @fixture_b; do
            FORMAT_CARD_TEST_CHANNEL="$channel" python -B test_brief_compiler.py
          done
      - name: Run synthetic subformula mapping suite
        env:
          VAULT_DIR: ${{ github.workspace }}/tests/fixtures/vault
          MAPPING_REGIME: synthetic
          MAPPING_SOURCE: local:${{ github.workspace }}/tests/fixtures/vault
        run: python -B -m unittest test_subformula_mapping test_source_context test_channel_identity test_publication_manifest test_transcript_registry_retirement -q
      - name: Run publication media contract tests
        run: python -m pytest test_publication_media.py -q
      - name: Run VPS release sync tests
        run: python -m pytest vps/test_release_sync.py -q
      - name: Run VPS activation tests
        run: python -m pytest vps/test_activation.py -q
      - name: Prepare runtime directory
        run: sudo mkdir -p /app/temp && sudo chmod 777 /app/temp
      - name: Run backend tests
        run: python -m pytest backend -q

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare runtime directory
        run: sudo mkdir -p /app/temp && sudo chmod 777 /app/temp
      - name: Import backend without starting external services
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
          R2_ACCOUNT_ID: ci-account
          R2_ACCESS_KEY_ID: ci-access-key
          R2_SECRET_ACCESS_KEY: ci-secret-key
          R2_BUCKET: ci-bucket
          R2_ENDPOINT: https://example.invalid
        run: python -c "import main; print(main.app.title)"
