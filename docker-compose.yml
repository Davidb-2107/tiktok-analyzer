services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./publication:/app/publication:ro
      - ./temp:/app/temp
      - ${HF_CACHE_DIR:-./hf_cache}:/root/.cache/huggingface
      - ${SCRIPT_INBOX_HOST:-./script_inbox}:/inbox/scripts
      # Local dev only — bridges the Sourcing transcript registry (sibling
      # project) so /jobs/{id}/save-transcript can write into it. Never add
      # this to docker-compose.prod.yml. The host path is explicit so the
      # repository can live outside the Obsidian vault.
      - type: bind
        source: "${SOURCING_HOST_DIR:?Set SOURCING_HOST_DIR to the local Vault Projects/Sourcing directory}"
        target: /sourcing
        read_only: false
      # Hub draft snapshots are explicit local inputs, never an implicit Vault.
      - type: bind
        source: "${HUB_DRAFT_HOST_ROOT:-./hub-draft}"
        target: /hub/draft
        read_only: true
      # Frame artifacts outlive/expire independently of text snapshots. The
      # operator owns retention and must preserve <opaque-id>.<image-extension>.
      - type: bind
        source: "${HUB_MEDIA_HOST_ROOT:-./hub-media}"
        target: /hub/media
        read_only: true
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - SCRIPT_INBOX_DIR=/inbox/scripts
      - INBOX_PSYCHO=${INBOX_PSYCHO:-/inbox/scripts}
      - INBOX_ARCHIVE=${INBOX_ARCHIVE:-}
      - HUB_ROUTE_ENABLED=${HUB_ROUTE_ENABLED:-false}
      - HUB_PROFILE=local
      - HUB_SOURCE_CONTEXT=${HUB_SOURCE_CONTEXT:-local:/hub/draft}
      - HUB_MEDIA_ROOT=/hub/media
      - VEILLE_WEBHOOK_URL=${VEILLE_WEBHOOK_URL:-}
      - VEILLE_WEBHOOK_SECRET=${VEILLE_WEBHOOK_SECRET:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - VITE_R2_BUCKET=${R2_BUCKET}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped
