services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./temp:/app/temp
      - ${HF_CACHE_DIR:-./hf_cache}:/root/.cache/huggingface
      - ${SCRIPT_INBOX_HOST:-./script_inbox}:/inbox/scripts
      # Local dev only — bridges the Sourcing transcript registry (sibling
      # project) so /jobs/{id}/save-transcript can write into it. Never add
      # this to docker-compose.prod.yml. The host path is explicit so the
      # repository can live outside the Obsidian vault.
      - type: bind
        source: "${SOURCING_HOST_DIR:-C:/Users/dbele/Documents/ObsidianVault/Wiki_Claude/Projects/Sourcing}"
        target: /sourcing
        read_only: false
      # Local dev only — vault racine en lecture seule pour le Niche Hub
      # (GET /hub). Jamais dans docker-compose.prod.yml : sans ce mount,
      # /hub répond 404 (garde VAULT_DIR). The host path is explicit because
      # the repository is maintained outside the Obsidian vault.
      - type: bind
        source: "${VAULT_HOST_DIR:-C:/Users/dbele/Documents/ObsidianVault/Wiki_Claude}"
        target: /vault
        read_only: true
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - SCRIPT_INBOX_DIR=/inbox/scripts
      - INBOX_PSYCHO=${INBOX_PSYCHO:-/inbox/scripts}
      - INBOX_ARCHIVE=${INBOX_ARCHIVE:-}
      - VAULT_DIR=/vault
      - VEILLE_WEBHOOK_URL=${VEILLE_WEBHOOK_URL:-}
      - VEILLE_WEBHOOK_SECRET=${VEILLE_WEBHOOK_SECRET:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - VITE_R2_BUCKET=${R2_BUCKET}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped
