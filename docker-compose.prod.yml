# Production compose for the Contabo VPS. Joins the shared docker_app-network
# so cloudflare-tunnel can reach the backend by its container name. No host
# port binding — all traffic enters via Cloudflare Tunnel.
#
# Usage on VPS:
#   cd /home/projects/tiktok-analyzer
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  tiktok-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: tiktok-analyzer
    volumes:
      - tiktok_temp:/app/temp
      - tiktok_hf_cache:/root/.cache/huggingface
      # Pinned text releases and frame artifacts are separate read-only stores.
      # No Vault is mounted. Media retention/GC is governed by
      # docs/runbooks/hub-media-retention.md, not snapshot publication/deletion.
      - type: bind
        source: "${HUB_RELEASE_HOST_ROOT:?set HUB_RELEASE_HOST_ROOT}"
        target: /hub/releases
        read_only: true
      - type: bind
        source: "${HUB_MEDIA_HOST_ROOT:?set HUB_MEDIA_HOST_ROOT}"
        target: /hub/media
        read_only: true
      # The activation tool is the sole writer; the Hub reads the directory
      # so atomic replacement of active-release is visible after reloads.
      - type: bind
        source: "${HUB_ACTIVE_STATE_HOST_ROOT:?set HUB_ACTIVE_STATE_HOST_ROOT}"
        target: /hub/state
        read_only: true
    env_file:
      - .env.prod
    environment:
      HUB_ROUTE_ENABLED: "${HUB_ROUTE_ENABLED:-true}"
      HUB_PROFILE: production
      HUB_ACTIVE_RELEASE_PATH: /hub/state/active-release
      HUB_RELEASE_ROOT: /hub/releases
      HUB_MEDIA_ROOT: /hub/media
    group_add:
      - "${HUB_ACTIVE_STATE_GID:?set HUB_ACTIVE_STATE_GID}"
    restart: unless-stopped
    networks:
      - app-network
    # No "ports:" — cloudflare-tunnel reaches the container at
    # http://tiktok-analyzer:8000 over the internal app-network.

networks:
  app-network:
    external: true
    name: docker_app-network

volumes:
  tiktok_temp:
  tiktok_hf_cache:
